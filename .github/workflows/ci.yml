name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Keep the declared MSRV honest: if this job is ever removed, drop
  # `rust-version` from Cargo.toml rather than publishing an unverified claim.
  MSRV: "1.80.0"

jobs:
  # A malformed workflow file fails at 0s with "this run likely failed because of
  # a workflow file issue" and no jobs, which is easy to misread as a test
  # failure. Catch it before it reaches a push.
  workflow-lint:
    name: workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No path argument: `args` is not shell-expanded, so a glob would be passed
      # through literally. actionlint lints .github/workflows by default.
      - uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  msrv:
    # The job `name` cannot reference the env context, so it is spelled out
    # here; the toolchain itself still comes from the MSRV env var below.
    name: rust (msrv 1.80.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.MSRV }}
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace

  # The package ships a native PyO3 extension, so an install of the built wheel
  # is verified on all three platforms, not just the one cargo test runs on.
  # This catches ABI and loader problems that `cargo test` cannot see.
  wheel:
    name: wheel install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          # Windows puts venv executables in Scripts/, not bin/. Every step below
          # runs under bash, so interpreter and console-script paths must be
          # OS-aware or the Windows job dies with exit 127.
          - os: ubuntu-latest
            venv: .wheeltest/bin
          - os: macos-latest
            venv: .wheeltest/bin
          - os: windows-latest
            venv: .wheeltest/Scripts
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install maturin pytest
      - run: maturin build --release --manifest-path python/microloop/Cargo.toml --out dist
      # Fresh environment: nothing but the wheel, exactly as a user would get it.
      - name: Install the wheel into a clean environment
        run: |
          python -m venv .wheeltest
          "${{ matrix.venv }}/python" -m pip install --upgrade pip
          "${{ matrix.venv }}/python" -m pip install dist/*.whl
          "${{ matrix.venv }}/python" -m pip install pytest
      # Exercise the installed console script, not just `python -m`, so a broken
      # entry point in packaging metadata is caught here rather than by a user.
      - name: Installed console script runs
        run: |
          "${{ matrix.venv }}/microloop" --version
          "${{ matrix.venv }}/microloop" doctor
      - name: Public API imports from the installed package
        run: |
          "${{ matrix.venv }}/python" -c "import microloop; print(microloop.__version__)"
      - name: CLI subcommands run against the installed wheel
        run: |
          "${{ matrix.venv }}/microloop" inspect python/microloop/tests/fixtures/sample_trajectory.jsonl
          "${{ matrix.venv }}/microloop" replay python/microloop/tests/fixtures/sample_trajectory.jsonl --json
      - name: Test suite passes against the installed wheel
        run: |
          "${{ matrix.venv }}/python" -m pytest python/microloop/tests/
      - name: The documented examples run
        run: |
          "${{ matrix.venv }}/python" examples/coding-agent/agent.py
          "${{ matrix.venv }}/python" examples/adaptive-coding-agent/agent.py
      - name: Decision demo runs end to end (exact engine, offline fixture)
        run: |
          "${{ matrix.venv }}/python" -m examples.refund_agent.agent --output .microloop/ci-smoke
          "${{ matrix.venv }}/microloop" sites --db .microloop/ci-smoke/decisions.db --json

  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The supported range declared in python/microloop/pyproject.toml.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install maturin pytest ruff
      - run: maturin build --manifest-path python/microloop/Cargo.toml --out dist
      - run: pip install dist/*.whl
      # Lint the whole tracked repository, not only python/.
      - run: ruff check .
      - run: pytest python/microloop/tests/
      - run: python examples/coding-agent/agent.py
      - run: python examples/adaptive-coding-agent/agent.py
      - run: python -m examples.refund_agent.agent --output .microloop/ci-smoke
      - run: microloop sites --db .microloop/ci-smoke/decisions.db --json
