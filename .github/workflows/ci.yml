name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo fmt --all --check
      - run: cargo test -p microloop --locked
      - run: cargo clippy -p microloop --all-targets --locked -- -D warnings
      - run: cargo build -p microloop-python --locked
