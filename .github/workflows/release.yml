name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  # PyPI publishing is live: the `microloop` distribution is owned by this
  # project (releases 0.1.1 .. 0.2.0) and 0.3.0 continues that line.
  #   Requires: a PyPI trusted publisher configured for this repository, or a
  #   `PYPI_API_TOKEN` repository secret. The job uses trusted publishing
  #   (OIDC) and needs no stored credential.
  #
  # crates.io publishing is off. `microloop-core` has never been published and no
  # registry token is configured here. Flip this to "true" once a
  # `CARGO_REGISTRY_TOKEN` secret exists, and add the `cargo add microloop-core`
  # instruction to the README at the same time.
  PUBLISH_PYPI: "true"
  PUBLISH_CRATES: "false"

jobs:
  # Nothing is published until the full gate passes: fmt, clippy, the whole-tree
  # lint, the Rust and Python test suites, the documented example, and a wheel
  # build. This is the same set of checks as `make check`.
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: ruff check .
      - run: maturin build --manifest-path python/microloop/Cargo.toml --out dist
      - run: pip install dist/*.whl
      - run: pytest python/microloop/tests/
      - run: python examples/coding-agent/agent.py

  wheels:
    name: wheels (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin
      - run: maturin build --release --manifest-path python/microloop/Cargo.toml --out dist
      # Install the freshly built wheel before it is allowed near PyPI.
      - name: Install the wheel into a clean environment
        run: |
          python -m venv .wheeltest
          .wheeltest/bin/python -m pip install --upgrade pip
          .wheeltest/bin/python -m pip install dist/*.whl
      - name: Native extension loads and the CLI works
        run: .wheeltest/bin/python -m microloop.cli doctor
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/*.whl

  # Records what a tag actually produced, so an unpublushed release is visible
  # rather than silent.
  release-summary:
    name: release summary
    needs: [verify, wheels, publish-pypi, publish-crates]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report publication state
        run: |
          echo "verify:     ${{ needs.verify.result }}"
          echo "wheels:     ${{ needs.wheels.result }}"
          echo "pypi:       ${{ needs.publish-pypi.result }}"
          echo "crates.io:  ${{ needs.publish-crates.result }}"
          if [ "${{ needs.publish-crates.result }}" != "success" ]; then
            echo "NOTE: crates.io publishing is disabled by design until a"
            echo "      registry token is configured. Wheels were still built,"
            echo "      verified, and published to PyPI."
          fi

  publish-pypi:
    name: publish (pypi)
    needs: [verify, wheels]
    if: env.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Trusted publishing (OIDC): requires a PyPI trusted publisher registered
      # for this repository and the `microloop` project name. No long-lived
      # token is stored in the repository.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-crates:
    name: publish (crates.io)
    needs: verify
    if: env.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - run: cargo publish -p microloop-core --locked
