[workspace]
resolver = "2"
members = ["crates/microloop-core", "python/microloop"]
default-members = ["crates/microloop-core"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.80.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Devaretanmay/microloop"
homepage = "https://github.com/Devaretanmay/microloop"

[workspace.dependencies]
regex = { version = "1.12.4", features = ["std", "unicode"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
