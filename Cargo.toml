[workspace]
resolver = "2"
members = ["python/microloop"]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.80.0"
license = "Apache-2.0"
repository = "https://github.com/Devaretanmay/microloop"
homepage = "https://github.com/Devaretanmay/microloop"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
