[package]
name = "microloop-compress"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Devaretanmay/microloop"
description = "Core Headroom types and compression transform traits (Rust)."

[lib]
doctest = false

[dependencies]
serde = { version = "1.0.228", features = ["derive", "alloc"] }
serde_json = { version = "1.0.150", default-features = false, features = ["alloc", "raw_value"] }
thiserror = "2.0"
tracing = "0.1"
regex = "1"
flate2 = "1"
aho-corasick = "1"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
redis = { version = "0.27", optional = true, default-features = false }

[features]
default = []
redis = ["dep:redis"]
rusqlite = ["dep:rusqlite"]
