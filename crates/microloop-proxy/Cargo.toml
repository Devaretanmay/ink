[package]
name = "microloop-proxy"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "HTTP proxy runtime for Microloop — intercepts LLM API calls for loop detection"
repository = "https://github.com/Devaretanmay/microloop"
homepage = "https://github.com/Devaretanmay/microloop"

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
reqwest = { version = "0.13.4", features = ["json"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
microloop = { path = "../../", version = "0.2.0" }
redis = { version = "1.3.0", features = ["tokio-comp"] }
async-trait = "0.1.89"
microloop-compress = { path = "../microloop-compress" }
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

[dev-dependencies]
tokio-test = "0.4.5"
uuid = { version = "1.11.0", features = ["v4"] }
futures = "0.3"
