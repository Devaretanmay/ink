[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ink"
version = "0.6.0rc2"
description = "Behavior JIT for production AI — learns which repeated decisions no longer need inference"
authors = [{ name = "Ink Team" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11, <3.14"
keywords = ["agent", "llm", "decision", "fast-path", "local-inference"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 4 - Beta",
]

dependencies = [
    "numpy>=2.0,<3",
    "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx[cpu]==0.32.2; sys_platform == 'linux'",
    "tokenizers>=0.21,<0.24",
    "huggingface-hub>=0.30,<2",
]

[project.optional-dependencies]
neural = []
mlx = []
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
benchmarks = [
    "litellm>=1.60",
    "mini-swe-agent>=2.4,<3.0",
    "swebench>=5.0",
]

[project.scripts]
ink = "ink.cli:main"

[project.urls]
Homepage = "https://github.com/Devaretanmay/ink"
Repository = "https://github.com/Devaretanmay/ink"

[tool.hatch.build.targets.wheel]
packages = ["python/ink/ink"]

[tool.hatch.build.targets.sdist]
only-include = [
    "python/ink",
    "README.md",
    "LICENSE",
    "NOTICE",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["target", "dist", ".venv", ".venv313"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/*" = ["E501", "B905", "F841", "E741", "E731", "B007", "F401", "I001"]

[tool.pytest.ini_options]
pythonpath = ["python/ink"]
testpaths = ["python/ink/tests"]
