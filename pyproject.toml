# Workspace-level developer tooling configuration.
# The distributable Python package is configured in python/microloop/pyproject.toml.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["benchmarks/results", "target"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["python/microloop/tests"]
