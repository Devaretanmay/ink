[package]
name = "microloop-python"
description = "Python bindings for the Microloop local reliability runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "microloop_core"
crate-type = ["cdylib"]

[dependencies]
# Renamed to avoid colliding with this crate's own lib name (`microloop_core`),
# which the `#[pymodule]` init symbol must use.
microloop = { package = "microloop-core", path = "../../crates/microloop-core" }
pyo3 = { version = "0.21.2", features = ["extension-module", "abi3-py310"] }
serde.workspace = true
serde_json.workspace = true
