[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "microloop"
version = "0.1.3"
description = "Local trajectory monitoring for autonomous agents"
authors = [{ name = "Microloop Team" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.8"
keywords = ["agent", "llm", "trajectory", "progress", "loop-detection"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 4 - Beta",
]

[project.urls]
Homepage = "https://github.com/Devaretanmay/microloop"
Repository = "https://github.com/Devaretanmay/microloop"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "microloop.microloop_core"
