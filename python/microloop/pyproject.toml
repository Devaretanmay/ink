[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "microloop"
version = "0.5.0"
description = "Verified local fast paths for repeated agent decisions"
authors = [{ name = "Microloop Team" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.11, <3.14"
keywords = ["agent", "llm", "decision", "fast-path", "local-inference"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 4 - Beta",
]

dependencies = [
    "mlx==0.32.2",
    "mlx[cpu]==0.32.2; sys_platform == 'linux'",
    "numpy>=2.0,<3",
    "tokenizers>=0.21,<0.24",
    "huggingface-hub>=0.30,<2",
]

[project.optional-dependencies]

# Only the optional local-model example needs this extra.
local-demo = ["mlx-lm==0.31.3; python_version >= '3.11' and sys_platform == 'darwin' and platform_machine == 'arm64'"]

[project.scripts]
microloop = "microloop.cli:main"

[project.urls]
Homepage = "https://github.com/Devaretanmay/microloop"
Repository = "https://github.com/Devaretanmay/microloop"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "microloop.microloop_core"
python-source = "."
# Without this, a stale local __pycache__ is packaged into the wheel.
exclude = ["**/__pycache__/**", "**/*.pyc", "**/tests/**"]
