[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "microloop"
version = "0.3.0"
description = "Local reliability runtime for autonomous agents"
authors = [{ name = "Microloop Team" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
requires-python = ">=3.10, <3.14"
keywords = ["agent", "llm", "trajectory", "progress", "loop-detection"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Development Status :: 4 - Beta",
]

[project.scripts]
microloop = "microloop.cli:main"

[project.urls]
Homepage = "https://github.com/Devaretanmay/microloop"
Repository = "https://github.com/Devaretanmay/microloop"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "microloop.microloop_core"
python-source = "."
# Without this, a stale local __pycache__ is packaged into the wheel.
exclude = ["**/__pycache__/**", "**/*.pyc", "**/tests/**"]
